{{- include "eruun.validateRuntime" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eruun.fullname" . }}
  labels:
    {{- include "eruun.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name }}
