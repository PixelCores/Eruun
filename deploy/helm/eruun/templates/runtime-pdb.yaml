{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.runtime.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "eruun.suffixedName" (dict "root" . "suffix" "runtime") }}
  labels:
    {{- include "eruun.labels" . | nindent 4 }}
spec:
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/component: runtime
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
