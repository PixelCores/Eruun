{{- include "eruun.validateRuntime" . -}}
{{- if .Release.IsUpgrade -}}
{{- $root := . -}}
{{- range $role := list "api" "controller" "scheduler" "worker" -}}
{{- $name := include "eruun.suffixedName" (dict "root" $root "suffix" $role) -}}
{{- $old := lookup "apps/v1" "Deployment" $root.Release.Namespace $name -}}
{{- $status := default dict $old.status -}}
{{- if and $old (or (gt (int $old.spec.replicas) 0) (gt (int $status.replicas) 0) (gt (int $status.terminatingReplicas) 0)) -}}
{{- fail (printf "stop the old four-role deployments and wait for their Pods to terminate before upgrading: %s is still active" $name) -}}
{{- end -}}
{{- end -}}
{{- $pods := lookup "v1" "Pod" .Release.Namespace "" -}}
{{- range $pod := default (list) (get $pods "items") -}}
{{- $labels := default dict $pod.metadata.labels -}}
{{- if and (eq (get $labels "app.kubernetes.io/instance") $root.Release.Name) (has (get $labels "app.kubernetes.io/component") (list "api" "controller" "scheduler" "worker")) -}}
{{- fail (printf "wait for the old four-role Pods to terminate before upgrading: %s still exists" $pod.metadata.name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- $root := . -}}
{{- $usesImportSecretKeyring := .Values.importSecretKeyring.existingSecret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eruun.suffixedName" (dict "root" $root "suffix" "runtime") }}
  labels:
    {{- include "eruun.labels" $root | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  replicas: {{ $root.Values.runtime.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: runtime
      app.kubernetes.io/instance: {{ $root.Release.Name }}
  template:
    metadata:
      labels:
        {{- include "eruun.labels" $root | nindent 8 }}
        app.kubernetes.io/component: runtime
    spec:
      serviceAccountName: {{ include "eruun.serviceAccountName" $root }}
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: {{ $root.Values.runtime.terminationGracePeriodSeconds }}
      containers:
        - name: eruun-server
          image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          args:
            - {{ printf "--log_dir=%s" $root.Values.log.dir | quote }}
            - {{ printf "--logtostderr=%t" $root.Values.log.toStderr | quote }}
            - {{ printf "--alsologtostderr=%t" $root.Values.log.alsoToStderr | quote }}
          ports:
            - name: http
              containerPort: {{ $root.Values.service.port }}
            - name: grpc
              containerPort: {{ $root.Values.service.grpcPort }}
          env:
            - name: ERUUN_AUTH_CONFIG_FILE
              value: /var/run/secrets/eruun/accounts/accounts.json
            {{- if $root.Values.jobs.existingSecret }}
            - name: ERUUN_JOBS_CONFIG_FILE
              value: /var/run/secrets/eruun/jobs/jobs.json
            {{- end }}
            - name: ERUUN_DATASTORE_SCHEMA_MODE
              value: {{ ternary "migrate" "validate" $root.Release.IsInstall | quote }}
            - name: ERUUN_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ERUUN_BIND_ADDR
              value: {{ printf "0.0.0.0:%v" $root.Values.service.port | quote }}
            - name: ERUUN_GRPC_BIND_ADDR
              value: {{ printf "0.0.0.0:%v" $root.Values.service.grpcPort | quote }}
            - name: ERUUN_LEADER_NAMESPACE
              value: {{ $root.Release.Namespace | quote }}
            - name: ERUUN_LEADER_LOCK_NAME
              value: {{ include "eruun.runtimeLockName" $root | quote }}
            - name: ERUUN_LEADER_SERVICE_NAME
              value: {{ include "eruun.fullname" $root | quote }}
            - name: ERUUN_WORKFLOW_HEARTBEAT_INTERVAL
              value: {{ $root.Values.runtime.heartbeatInterval | quote }}
            - name: ERUUN_WORKFLOW_LEASE_DURATION
              value: {{ $root.Values.runtime.leaseDuration | quote }}
            - name: ERUUN_WORKFLOW_LEASE_REAPER_INTERVAL
              value: {{ $root.Values.runtime.leaseReaperInterval | quote }}
            - name: ERUUN_WORKFLOW_WORKER_DRAIN_TIMEOUT
              value: {{ printf "%ds" (int $root.Values.runtime.workerDrainTimeoutSeconds) | quote }}
            {{- include "eruun.datastoreEnv" $root | nindent 12 }}
            - name: ERUUN_CACHE_TYPE
              value: redis
            - name: ERUUN_CACHE_HOST
              value: {{ include "eruun.suffixedName" (dict "root" $root "suffix" "redis") }}
            - name: ERUUN_CACHE_PORT
              value: {{ $root.Values.redis.servicePort | quote }}
            - name: ERUUN_CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "eruun.suffixedName" (dict "root" $root "suffix" "redis") }}
                  key: password
            - name: ERUUN_MSG_TYPE
              value: redis
            {{- if $usesImportSecretKeyring }}
            - name: ERUUN_IMPORT_SECRET_KEYRING_FILE
              value: /var/run/secrets/eruun/import-secret-keyring/keyring.json
            {{- end }}
            {{- range $root.Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: accounts
              mountPath: /var/run/secrets/eruun/accounts
              readOnly: true
          {{- if $root.Values.jobs.existingSecret }}
            - name: jobs-config
              mountPath: /var/run/secrets/eruun/jobs
              readOnly: true
          {{- end }}
          {{- if $usesImportSecretKeyring }}
            - name: import-secret-keyring
              mountPath: /var/run/secrets/eruun/import-secret-keyring
              readOnly: true
          {{- end }}
          startupProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml $root.Values.runtime.resources | nindent 12 }}
      volumes:
      {{- if $root.Values.jobs.existingSecret }}
        - name: jobs-config
          secret:
            secretName: {{ $root.Values.jobs.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ required "jobs.key is required when jobs.existingSecret is set" $root.Values.jobs.key | quote }}
                path: jobs.json
      {{- end }}
        - name: accounts
          secret:
            secretName: {{ $root.Values.auth.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ $root.Values.auth.key | quote }}
                path: accounts.json
      {{- if $usesImportSecretKeyring }}
        - name: import-secret-keyring
          secret:
            secretName: {{ $root.Values.importSecretKeyring.existingSecret | quote }}
            items:
              - key: {{ required "importSecretKeyring.key is required when importSecretKeyring.existingSecret is set" $root.Values.importSecretKeyring.key | quote }}
                path: keyring.json
      {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $root.Values.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ $root.Values.topologySpreadConstraints.maxSkew }}
          topologyKey: {{ $root.Values.topologySpreadConstraints.topologyKey | quote }}
          whenUnsatisfiable: {{ $root.Values.topologySpreadConstraints.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/component: runtime
              app.kubernetes.io/instance: {{ $root.Release.Name }}
      {{- end }}
