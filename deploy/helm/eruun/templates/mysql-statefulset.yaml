{{- $mysqlPassword := required "mysql.rootPassword is required" .Values.mysql.rootPassword -}}
{{- if hasPrefix "__REPLACE_" $mysqlPassword -}}
{{- fail "mysql.rootPassword must not contain placeholder text" -}}
{{- end -}}
{{- $mysqlSecretName := include "eruun.suffixedName" (dict "root" . "suffix" "mysql") -}}
{{- $mysqlDatastoreURL := printf "root:%s@tcp(%s:%v)/%s?charset=utf8&parseTime=true" .Values.mysql.rootPassword $mysqlSecretName .Values.mysql.servicePort .Values.mysql.database -}}
{{- $existingMysqlName := include "eruun.persistentWorkloadName" (dict "root" . "component" "mysql" "currentName" $mysqlSecretName) -}}
{{- if $existingMysqlName -}}
{{- if ne $existingMysqlName $mysqlSecretName -}}
{{- fail "fullname is immutable for an existing bundled MySQL volume; use a separate data migration procedure" -}}
{{- end -}}
{{- $existingMysqlSecret := lookup "v1" "Secret" .Release.Namespace $existingMysqlName -}}
{{- if not $existingMysqlSecret -}}
{{- fail "the bundled MySQL workload exists but its credential Secret is missing" -}}
{{- end -}}
{{- $existingMysqlData := default dict $existingMysqlSecret.data -}}
{{- $existingMysqlPassword := (default "" (index $existingMysqlData "password")) | b64dec -}}
{{- $existingDatastoreURL := (default "" (index $existingMysqlData "datastore-url")) | b64dec -}}
{{- if or (ne $existingMysqlPassword .Values.mysql.rootPassword) (ne $existingDatastoreURL $mysqlDatastoreURL) -}}
{{- fail "mysql.rootPassword, mysql.database, and mysql.servicePort are immutable for an existing bundled MySQL volume; use a separate credential or database migration procedure" -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $mysqlSecretName }}
  labels:
    {{- include "eruun.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: {{ .Values.mysql.servicePort }}
      targetPort: mysql
  selector:
    app.kubernetes.io/component: mysql
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $mysqlSecretName }}
  labels:
    {{- include "eruun.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
spec:
  serviceName: {{ $mysqlSecretName }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mysql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "eruun.labels" . | nindent 8 }}
        app.kubernetes.io/component: mysql
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          imagePullPolicy: Always
          args: ["--port={{ .Values.mysql.servicePort }}"]
          ports:
            - name: mysql
              containerPort: {{ .Values.mysql.servicePort }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $mysqlSecretName }}
                  key: password
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database }}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "mysqladmin ping -h 127.0.0.1 -P {{ .Values.mysql.servicePort }} -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "mysqladmin ping -h 127.0.0.1 -P {{ .Values.mysql.servicePort }} -p$MYSQL_ROOT_PASSWORD"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.mysql.storage }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $mysqlSecretName }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    {{- include "eruun.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql
type: Opaque
data:
  password: {{ .Values.mysql.rootPassword | b64enc }}
  database: {{ .Values.mysql.database | b64enc }}
  datastore-url: {{ $mysqlDatastoreURL | b64enc }}
