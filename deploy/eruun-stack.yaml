---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eruun-worker
  namespace: eruun-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: eruun
      app.kubernetes.io/component: worker
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eruun
  namespace: eruun-system
spec:
  ingressClassName: ingress-nginx
  rules:
    - host: eruun.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eruun
                port:
                  number: 8000
