syntax = "proto3";

package eruun.v1;

option go_package = "github.com/PixelCores/Eruun/pkg/apiserver/interfaces/grpc/pb/v1;eruunv1";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "eruun/v1/applications.proto";

// JobsService is the user-session API. Runner capability callbacks are HTTP-only.
service JobsService {
  rpc CreateJobDefinition(JobSpec) returns (JobDefinition);
  rpc GetJobDefinition(JobDefinitionRequest) returns (JobDefinition);
  rpc ListJobDefinitions(ListJobDefinitionsRequest) returns (JobDefinitions);
  rpc UpdateJobDefinition(UpdateJobDefinitionRequest) returns (JobDefinition);
  rpc DeleteJobDefinition(JobDefinitionRequest) returns (google.protobuf.Empty);
  rpc RunJobDefinition(RunJobDefinitionRequest) returns (JobAccepted);
  rpc SubmitJob(SubmitJobRequest) returns (JobAccepted);
  rpc ListJobs(ListJobsRequest) returns (JobRuns);
  rpc GetJob(JobTaskRequest) returns (JobDetail);
  rpc CancelJob(JobTaskRequest) returns (google.protobuf.Empty);
  rpc GetJobResults(JobTaskRequest) returns (JobResults);
  rpc DownloadJobResult(JobArtifactRequest) returns (stream ArchiveChunk);
  rpc DownloadJobDelivery(JobDeliveryRequest) returns (stream ArchiveChunk);
  rpc RetryJobDelivery(JobDeliveryRequest) returns (google.protobuf.Empty);
  rpc SetJobRetention(SetJobRetentionRequest) returns (google.protobuf.Empty);
  rpc GetJobStoragePolicy(google.protobuf.Empty) returns (JobStoragePolicy);
  rpc SetJobStoragePolicy(JobResultPolicy) returns (google.protobuf.Empty);
  rpc UploadJobDataset(stream UploadDatasetPart) returns (JobArtifact);
  rpc ListJobDatasets(ListJobDatasetsRequest) returns (JobArtifacts);
  rpc GetJobDataset(JobDatasetRequest) returns (JobArtifact);
  rpc DownloadJobDataset(JobDatasetRequest) returns (stream ArchiveChunk);
}

// execution_key is required for Application workflow evaluation results.
// Standalone Jobs can omit it only when the evaluation execution is unique.
// CancelJob accepts only the parent task_id.
message JobTaskRequest { string task_id = 1; string execution_key = 2; }
message JobArtifactRequest { string task_id = 1; string artifact_id = 2; string execution_key = 3; }
message JobDeliveryRequest { string task_id = 1; string target = 2; string execution_key = 3; }
message JobDatasetRequest { string dataset_id = 1; }
message SetJobRetentionRequest { string task_id = 1; int32 retention_days = 2; string execution_key = 3; }
message ListJobDatasetsRequest { optional int32 page = 1; optional int32 page_size = 2; }
message JobDefinitionRequest { string definition_id = 1; }
message ListJobDefinitionsRequest { optional int32 page = 1; optional int32 page_size = 2; }
message UpdateJobDefinitionRequest { string definition_id = 1; JobSpec spec = 2; }
message RunJobDefinitionRequest { string definition_id = 1; int64 execute_at = 2; }
message ListJobsRequest {
  string definition_id = 1;
  optional int32 page = 2;
  optional int32 page_size = 3;
}

message JobStoragePolicy { repeated string available_targets = 1; JobResultPolicy policy = 2; }

message JobVolume {
  string size = 1;
  string storage_class = 2;
  string access_mode = 3;
}
message JobStepRetry { int32 backoff_limit = 1; }
message JobStep {
  string name = 1;
  string type = 2;
  // Command inputs only. Evaluation steps use traits.eval and omit spec.
  google.protobuf.Value spec = 3;
  AppSpecTraits traits = 4;
  JobStepRetry retry = 5;
}
message JobStage { string name = 1; repeated JobStep steps = 2; }
message SubmitJobRequest {
  string workspace_id = 1;
  string name = 2;
  reserved 3, 4, 5, 6;
  reserved "type", "spec", "traits", "result_policy";
  JobVolume volume = 7;
  repeated JobStage stages = 8;
  // Unix seconds; zero or past times execute immediately, negatives are invalid.
  int64 execute_at = 9;
}
message JobSpec {
  string name = 1;
  reserved 2, 3, 4, 5;
  reserved "type", "spec", "traits", "result_policy";
  JobVolume volume = 6;
  repeated JobStage stages = 7;
}
message JobAccepted {
  string task_id = 1;
  string workspace_id = 2;
  string type = 3;
  string status = 4;
}
message JobDefinition {
  string id = 1;
  string name = 2;
  uint64 revision = 3;
  JobSpec spec = 4;
  string creator = 5;
  google.protobuf.Timestamp create_time = 6;
  google.protobuf.Timestamp update_time = 7;
}
message JobDefinitions {
  repeated JobDefinition items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
message JobRun {
  JobAccepted accepted = 1;
  string name = 2;
  string job_definition_id = 3;
  uint64 job_definition_revision = 4;
  int64 execute_at = 5;
  string creator = 6;
  google.protobuf.Timestamp create_time = 7;
  google.protobuf.Timestamp update_time = 8;
}
message JobRuns {
  repeated JobRun items = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}
message JobExecution {
  int64 id = 1;
  string type = 2;
  string workflow_id = 3;
  string product_id = 4;
  string workspace_id = 5;
  string app_id = 6;
  string task_id = 7;
  string status = 8;
  int64 start_time = 9;
  int64 end_time = 10;
  string info = 11;
  string service_name = 12;
  string error = 13;
  bool production = 14;
  string target_env = 15;
  optional string execution_key = 16;
  uint64 run_generation = 17;
  uint32 attempt = 18;
  string scheduling_state = 19;
  string scheduling_class = 20;
  int32 scheduling_priority = 21;
  google.protobuf.Timestamp scheduling_queued_at = 22;
  string scheduling_reason = 23;
  google.protobuf.Timestamp create_time = 24;
  google.protobuf.Timestamp update_time = 25;
}
message JobArtifact {
  string id = 1;
  string workspace_id = 2;
  string task_id = 3;
  string kind = 4;
  string name = 5;
  string digest = 6;
  int64 size = 7;
  google.protobuf.Value manifest = 8;
  google.protobuf.Value summary = 9;
  string reference = 10;
  google.protobuf.Timestamp expires_at = 11;
  bool expired = 12;
  google.protobuf.Timestamp create_time = 13;
  google.protobuf.Timestamp update_time = 14;
  string execution_key = 15;
}
message JobDelivery {
  string id = 1;
  string workspace_id = 2;
  string task_id = 3;
  string source_id = 4;
  string target = 5;
  string mode = 6;
  string state = 7;
  int32 attempts = 8;
  string error = 9;
  string reference = 10;
  google.protobuf.Timestamp create_time = 11;
  google.protobuf.Timestamp update_time = 12;
  string execution_key = 13;
}
message JobRunnerProgress { int32 completed_trials = 1; int32 total_trials = 2; }
message JobRunnerTerminal {
  string outcome = 1;
  optional int32 exit_code = 2;
  string signal = 3;
  string artifact_id = 4;
  string artifact_digest = 5;
  bool collection_complete = 6;
  string reason = 7;
  string message = 8;
}
message JobRunnerStatus {
  string phase = 1;
  uint64 sequence = 2;
  google.protobuf.Timestamp last_heartbeat_at = 3;
  bool stale = 4;
  JobRunnerProgress progress = 5;
  JobRunnerTerminal terminal = 6;
}
// Sandbox lifecycle observation; ready is not proof that a trial executed.
message JobSandboxStatus {
  string trial_id = 1;
  string state = 2;
  bool admitted = 3;
  string namespace = 4;
  string sandbox_name = 5;
  string sandbox_uid = 6 [json_name = "sandboxUID"];
  string pod_name = 7;
  string pod_uid = 8 [json_name = "podUID"];
  string container_name = 9;
  google.protobuf.Timestamp retain_until = 10;
  string reason = 11;
}
message JobDetail {
  JobAccepted accepted = 1;
  JobSpec job = 2;
  repeated JobExecution executions = 3;
  repeated JobArtifact results = 4;
  repeated JobDelivery deliveries = 5;
  string collection_state = 6;
  JobRunnerStatus runner_status = 7;
  string execution_key = 8;
  string framework_version = 9;
  repeated JobSandboxStatus sandboxes = 10;
  bool sandboxes_truncated = 11;
}
message JobResults {
  string collection_state = 1;
  repeated JobArtifact artifacts = 2;
  repeated JobDelivery deliveries = 3;
  string execution_key = 4;
}
message JobArtifacts { repeated JobArtifact artifacts = 1; }

message UploadDatasetHeader { string name = 1; }
message UploadDatasetPart {
  oneof part {
    UploadDatasetHeader header = 1;
    bytes chunk = 2;
  }
}
message ArchiveChunk { bytes data = 1; }
