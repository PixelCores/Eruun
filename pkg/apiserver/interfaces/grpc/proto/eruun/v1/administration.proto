syntax = "proto3";

package eruun.v1;

option go_package = "github.com/PixelCores/Eruun/pkg/apiserver/interfaces/grpc/pb/v1;eruunv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

service SettingsService {
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);
  rpc GetSetting(GetSettingRequest) returns (SystemSetting);
  rpc CreateSetting(CreateSettingRequest) returns (SystemSetting);
  rpc UpdateSetting(UpdateSettingRequest) returns (SystemSetting);
  rpc DeleteSetting(DeleteSettingRequest) returns (DeleteSettingResponse);
}

message ListSettingsRequest {}
message GetSettingRequest { string type = 1; }
message CreateSettingRequest {
  string type = 1;
  google.protobuf.Value value = 2;
}
message UpdateSettingRequest {
  string type = 1;
  google.protobuf.Value value = 2;
}
message DeleteSettingRequest { string type = 1; }

message SystemSetting {
  string type = 1;
  google.protobuf.Value value = 2;
  google.protobuf.Timestamp create_time = 3;
  google.protobuf.Timestamp update_time = 4;
}

message ListSettingsResponse { repeated SystemSetting settings = 1; }
message DeleteSettingResponse { string type = 1; }
