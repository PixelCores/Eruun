# A fixed experiment point, not a production sizing recommendation.
# Two identical nodes: one elected Leader and one Worker in steady state.
# Supply a verified image and existing auth/jobs Secrets in private values.
runtime:
  replicas: 2
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "4"
      memory: 8Gi

# Helm replaces arrays: merge any existing env entries into a private copy first.
# This limit applies when a node executes Worker tasks, not to global admission.
env:
  - name: ERUUN_WORKFLOW_MAX_CONCURRENT
    value: "100"
