# Eruun API Server runtime defaults reference.
# This file documents recommended defaults; the server still reads flags/env.
# Mapping:
# - workflow.callbackTimeoutMax -> --workflow-callback-timeout-max
# - env key: ERUUN_WORKFLOW_CALLBACK_TIMEOUT_MAX

# Required account/OAuth/delivery/workspace Secret JSON, read by every runtime node.
# Flag --auth-config-file, environment ERUUN_AUTH_CONFIG_FILE.
authConfigFile: /var/run/secrets/eruun/accounts/accounts.json
# Optional Harbor Runner / MinIO configuration mounted from a Secret.
# Flag --jobs-config-file, environment ERUUN_JOBS_CONFIG_FILE.
jobsConfigFile: ""

# Local MySQL connection template. Replace the password placeholder via
# --datastore-url / ERUUN_DATASTORE_URL; the DSN is the only database-name source.
# Startup rejects unchanged password placeholders.
datastore:
  url: "eruun:__REPLACE_WITH_MYSQL_PASSWORD__@tcp(127.0.0.1:3306)/eruun?charset=utf8mb4&parseTime=true"

# Runtime queues are Redis Streams on the cache connection.
messaging:
  # --msg-channel-prefix / ERUUN_MSG_CHANNEL_PREFIX
  channelPrefix: eruun
  # --msg-redis-maxlen / ERUUN_MSG_REDIS_MAXLEN (<=0 disables the XADD MAXLEN cap)
  redisStreamMaxLen: 50000

# Every node participates in the same Lease election. Only its leader serves
# business APIs and scheduling; other nodes execute tasks.
leader:
  # --leader-lock-name / ERUUN_LEADER_LOCK_NAME
  lockName: eruun-runtime
  # --leader-service-name / ERUUN_LEADER_SERVICE_NAME. Empty for local access;
  # cluster deployments set the API Service and --pod-name to the Pod name.
  # Election --id defaults to a fresh UUID for each process; do not reuse Pod names.
  serviceName: ""
  namespace: eruun-system
  duration: 15s

workflow:
  # Maximum timeout for workflow callback requests.
  # Values above this limit are capped to avoid duration overflow.
  callbackTimeoutMax: 72h

# Inbound entry point for component routes. Empty provider disables them.
# Helm renders these from the gateway values; they are never read from the
# account configuration Secret.
gateway:
  # --gateway-provider / ERUUN_GATEWAY_PROVIDER: "" or ingress
  provider: ""
  # --gateway-domain / ERUUN_GATEWAY_DOMAIN: DNS suffix of component hosts
  domain: ""
  # --gateway-proxy-namespace / ERUUN_GATEWAY_PROXY_NAMESPACE: gateway data-plane Pods
  proxyNamespace: ""
  # --gateway-ingress-class / ERUUN_GATEWAY_INGRESS_CLASS: IngressClass for provider=ingress
  ingressClass: ""
