# Eruun API Server runtime defaults reference.
# This file documents recommended defaults; the server still reads flags/env.
# Mapping:
# - workflow.callbackTimeoutMax -> --workflow-callback-timeout-max
# - env key: ERUUN_WORKFLOW_CALLBACK_TIMEOUT_MAX

workflow:
  # Maximum timeout for workflow callback requests.
  # Values above this limit are capped to avoid duration overflow.
  callbackTimeoutMax: 72h
