syntax = "proto3";

package eruun.v1;

option go_package = "github.com/PixelCores/Eruun/pkg/apiserver/interfaces/grpc/pb/v1;eruunv1";

import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// ApplicationService mirrors the user-facing application and Workflow routes.
service ApplicationService {
  rpc GetCanonicalJSONSchema(google.protobuf.Empty) returns (CanonicalJSONSchema);
  rpc ListApplications(ApplicationListRequest) returns (AppDTOListApplicationResponse);
  rpc ListTemplateApplications(ApplicationListRequest) returns (AppDTOListApplicationResponse);
  rpc ListCronJobs(google.protobuf.Empty) returns (ApplicationCronJobs);
  rpc ListScheduledJobs(google.protobuf.Empty) returns (ApplicationScheduledJobs);
  rpc CreateApplications(AppDTOCreateApplicationsRequest) returns (AppDTOApplicationBase);
  rpc CreateAndExecApplications(AppDTOCreateAndExecApplicationRequest) returns (AppDTOCreateAndExecApplicationResponse);
  rpc BatchGetApplications(AppDTOBatchGetApplicationsRequest) returns (AppDTOBatchGetApplicationsResponse);
  rpc ConvertApplications(AppDTOConvertApplicationsRequest) returns (AppDTOConvertApplicationsResponse);
  rpc ImportNamespaceApplications(AppDTOImportNamespaceApplicationsRequest) returns (AppDTOImportNamespaceApplicationsResponse);
  rpc TryImportNamespaceApplications(AppDTOTryImportNamespaceApplicationsRequest) returns (AppDTOTryImportNamespaceApplicationsResponse);
  rpc ListApplicationWorkflows(ApplicationIDRequest) returns (AppDTOListApplicationWorkflowsResponse);
  rpc GetApplicationSpec(ApplicationIDRequest) returns (AppDTOCreateApplicationsRequest);
  rpc GetApplicationStatus(ApplicationIDRequest) returns (AppDTOApplicationStatusResponse);
  rpc ListApplicationComponents(ApplicationIDRequest) returns (AppDTOListApplicationComponentsResponse);
  rpc GetApplicationComponentStatus(ApplicationIDRequest) returns (AppDTOApplicationComponentStatusResponse);
  rpc ListComponentContainers(ApplicationComponentRequest) returns (AppDTOComponentContainersResponse);
  rpc BatchApplicationComponentStatus(AppDTOBatchApplicationComponentStatusRequest) returns (AppDTOBatchApplicationComponentStatusResponse);
  rpc StreamComponentLogs(ComponentLogsRequest) returns (stream ComponentLogLine);
  rpc ExportComponentFiles(ComponentFilesRequest) returns (stream ComponentFileChunk);
  rpc ExecComponentShell(ComponentShellRequest) returns (AppDTOExecComponentShellScriptResponse);
  rpc StreamComponentShell(ComponentShellRequest) returns (stream ComponentShellEvent);
  rpc DeleteApplication(DeleteApplicationRPCRequest) returns (AppDTODeleteApplicationResponse);
  rpc UpdateApplicationWorkflow(UpdateApplicationWorkflowRPCRequest) returns (AppDTOUpdateWorkflowResponse);
  rpc ListWorkflowSchedules(ApplicationIDRequest) returns (AppDTOListWorkflowSchedulesResponse);
  rpc UpsertWorkflowSchedule(UpsertWorkflowScheduleRPCRequest) returns (AppDTOUpsertWorkflowScheduleResponse);
  rpc DeleteWorkflowSchedule(ApplicationWorkflowRequest) returns (AppDTODeleteWorkflowScheduleResponse);
  rpc PlanApplicationResourceCleanup(ApplicationIDRequest) returns (AppDTOCleanupApplicationResourcesPlanResponse);
  rpc ApplyApplicationResourceCleanup(CleanupApplicationRPCRequest) returns (AppDTOCleanupApplicationResourcesResponse);
  rpc ResetApplicationDatabases(ResetApplicationDatabasesRPCRequest) returns (AppDTODatabaseResetResponse);
  rpc DownloadLogArchive(LogArchiveRPCRequest) returns (stream ComponentFileChunk);
  rpc RestartApplicationWorkloads(ApplicationLifecycleRPCRequest) returns (AppDTORestartApplicationWorkloadsResponse);
  rpc StopApplicationDeployments(ApplicationLifecycleRPCRequest) returns (AppDTOStopApplicationDeploymentsResponse);
  rpc StartApplicationDeployments(ApplicationLifecycleRPCRequest) returns (AppDTOStartApplicationDeploymentsResponse);
  rpc ExecApplicationWorkflow(ExecWorkflowRPCRequest) returns (AppDTOExecWorkflowResponse);
  rpc CancelApplicationWorkflow(CancelWorkflowRPCRequest) returns (AppDTOCancelWorkflowResponse);
  rpc CancelAllApplicationWorkflows(ApplicationIDRequest) returns (AppDTOCancelAllApplicationWorkflowsResponse);
  rpc ListApplicationTasks(ApplicationIDRequest) returns (AppDTOListApplicationTasksResponse);
  rpc ApproveWorkflowTask(TaskApprovalRPCRequest) returns (AppDTOTaskApprovalResponse);
  rpc GetWorkflowTaskStatus(WorkflowTaskIDRequest) returns (AppDTOTaskStatusResponse);
  rpc GetWorkflowTaskStages(WorkflowTaskIDRequest) returns (AppDTOTaskStagesResponse);
  rpc UpdateApplicationVersion(UpdateVersionRPCRequest) returns (AppDTOUpdateVersionResponse);
  rpc DiffUpdateApplicationVersion(DiffUpdateVersionRPCRequest) returns (AppDTODiffUpdateVersionResponse);
  rpc CancelDelayedVersionUpdate(CancelWorkflowRPCRequest) returns (AppDTOCancelWorkflowResponse);
  rpc TryApplication(AppDTOCreateApplicationsRequest) returns (AppDTOTryApplicationResponse);
  rpc TryWorkflow(UpdateApplicationWorkflowRPCRequest) returns (AppDTOTryWorkflowResponse);
}

// JSON Schema is an original document, not a dynamic JSON request envelope.
message CanonicalJSONSchema { bytes json_schema = 1; }
message ApplicationListRequest { optional int32 page = 1; optional int32 page_size = 2; }
message ApplicationIDRequest { string app_id = 1; }
message WorkflowTaskIDRequest { string task_id = 1; }
message ApplicationWorkflowRequest { string app_id = 1; string workflow_id = 2; }
message ApplicationComponentRequest { string app_id = 1; string component_name = 2; }
message ApplicationCronJobs { repeated AppDTOCronJobInfo jobs = 1; }
message ApplicationScheduledJobs { repeated AppDTOScheduledJobInfo jobs = 1; }

message ComponentLogsRequest { string app_id = 1; string component_name = 2; string container = 3; }
message ComponentLogLine {
  string pod_name = 1;
  string container_name = 2;
  bytes data = 3;
  // True when a logical log line continues in the next chunk.
  bool continuation = 4;
}
message ComponentFilesRequest {
  string app_id = 1;
  string component_name = 2;
  AppDTOExportComponentFilesRequest request = 3;
}
message ComponentShellRequest {
  string app_id = 1;
  string component_name = 2;
  AppDTOExecComponentShellScriptRequest request = 3;
}
message ComponentShellEvent {
  string pod_name = 1;
  string container_name = 2;
  string type = 3;
  bytes chunk = 4;
  optional int32 exit_code = 5;
  optional bool succeeded = 6;
  string message = 7;
}
message ComponentFileChunk {
  bytes data = 1;
  string file_name = 2;
  string content_type = 3;
  string pod_name = 4;
  string container_name = 5;
}
message DeleteApplicationRPCRequest { string app_id = 1; AppDTODeleteApplicationRequest request = 2; }
message UpdateApplicationWorkflowRPCRequest { string app_id = 1; AppDTOUpdateApplicationWorkflowRequest request = 2; }
message UpsertWorkflowScheduleRPCRequest { string app_id = 1; AppDTOUpsertWorkflowScheduleRequest request = 2; }
message CleanupApplicationRPCRequest { string app_id = 1; AppDTOCleanupApplicationResourcesRequest request = 2; }
message ResetApplicationDatabasesRPCRequest { string app_id = 1; AppDTODatabaseResetRequest request = 2; }
message LogArchiveRPCRequest { string app_id = 1; AppDTOLogArchiveDownloadRequest request = 2; }
message ApplicationLifecycleRPCRequest { string app_id = 1; AppDTOApplicationLifecycleRequest request = 2; }
message ExecWorkflowRPCRequest { string app_id = 1; AppDTOExecWorkflowRequest request = 2; }
message CancelWorkflowRPCRequest { string app_id = 1; AppDTOCancelWorkflowRequest request = 2; }
message TaskApprovalRPCRequest { string task_id = 1; AppDTOTaskApprovalRequest request = 2; }
message UpdateVersionRPCRequest { string app_id = 1; AppDTOUpdateVersionRequest request = 2; }
message DiffUpdateVersionRPCRequest { string app_id = 1; AppDTODiffUpdateVersionRequest request = 2; }
message AppDTOCreateAndExecApplicationResponse {
  AppDTOApplicationBase application = 1 [json_name = "application"];
  string workflow_id = 2 [json_name = "workflowId"];
  string task_id = 3 [json_name = "taskId"];
  string exec_status = 4 [json_name = "execStatus"];
  string exec_error = 5 [json_name = "execError"];
  repeated AppDTOAllowedAction allowed_actions = 6 [json_name = "allowedActions"];
}

message AppDTOCronJobInfo {
  string name = 1 [json_name = "name"];
  string namespace = 2 [json_name = "namespace"];
  string schedule = 3 [json_name = "schedule"];
  bool suspend = 4 [json_name = "suspend"];
  string concurrency_policy = 5 [json_name = "concurrencyPolicy"];
  optional int32 successful_jobs_history_limit = 6 [json_name = "successfulJobsHistoryLimit"];
  optional int32 failed_jobs_history_limit = 7 [json_name = "failedJobsHistoryLimit"];
  google.protobuf.Timestamp last_schedule_time = 8 [json_name = "lastScheduleTime"];
  google.protobuf.Timestamp last_successful_time = 9 [json_name = "lastSuccessfulTime"];
  google.protobuf.Timestamp create_time = 10 [json_name = "createTime"];
}

message AppDTOScheduledJobInfo {
  string app_id = 1 [json_name = "appId"];
  string app_name = 2 [json_name = "appName"];
  string app_namespace = 3 [json_name = "appNamespace"];
  string component_name = 4 [json_name = "componentName"];
  string component_namespace = 5 [json_name = "componentNamespace"];
  string image = 6 [json_name = "image"];
  string schedule = 7 [json_name = "schedule"];
  int64 start_time = 8 [json_name = "startTime"];
  string run_policy = 9 [json_name = "runPolicy"];
  google.protobuf.Timestamp create_time = 10 [json_name = "createTime"];
  google.protobuf.Timestamp update_time = 11 [json_name = "updateTime"];
}
message AppDTOAllowedAction {
  string name = 1 [json_name = "name"];
  string method = 2 [json_name = "method"];
  string path = 3 [json_name = "path"];
  google.protobuf.Struct body = 4 [json_name = "body"];
}

message AppDTOApplicationBase {
  string workspace_id = 1 [json_name = "workspaceID"];
  string id = 2 [json_name = "id"];
  string name = 3 [json_name = "name"];
  string namespace = 4 [json_name = "namespace"];
  string alias = 5 [json_name = "alias"];
  string project = 6 [json_name = "project"];
  string version = 7 [json_name = "version"];
  string description = 8 [json_name = "description"];
  google.protobuf.Timestamp create_time = 9 [json_name = "createTime"];
  google.protobuf.Timestamp update_time = 10 [json_name = "updateTime"];
  string icon = 11 [json_name = "icon"];
  string workflow_id = 12 [json_name = "workflowId"];
  bool template_enabled = 13 [json_name = "templateEnabled"];
  string management_mode = 14 [json_name = "managementMode"];
  AppDTOApplicationResources resources = 15 [json_name = "resources"];
}

message AppDTOApplicationComponent {
  int32 id = 1 [json_name = "id"];
  string app_id = 2 [json_name = "appId"];
  string name = 3 [json_name = "name"];
  string namespace = 4 [json_name = "namespace"];
  string image = 5 [json_name = "image"];
  int32 replicas = 6 [json_name = "replicas"];
  string component_type = 7 [json_name = "type"];
  AppSpecProperties properties = 8 [json_name = "properties"];
  AppSpecTraits traits = 9 [json_name = "traits"];
  repeated AppSpecSidecarTraitsSpec sidecars = 10 [json_name = "sidecars"];
  repeated AppDTOComponentServiceInfo services = 11 [json_name = "services"];
  repeated AppDTOComponentIngressInfo ingresses = 12 [json_name = "ingresses"];
  repeated AppDTOComponentResourceConfig resource_configs = 13 [json_name = "resourceConfigs"];
  repeated AppDTOComponentCredentialInfo credentials = 14 [json_name = "credentials"];
  string status = 15 [json_name = "status"];
  string last_abnormal = 16 [json_name = "lastAbnormal"];
  repeated AppDTOExternalLink external_links = 17 [json_name = "externalLinks"];
  google.protobuf.Timestamp create_time = 18 [json_name = "createTime"];
  google.protobuf.Timestamp update_time = 19 [json_name = "updateTime"];
}

message AppDTOApplicationComponentStatus {
  string name = 1 [json_name = "name"];
  string namespace = 2 [json_name = "namespace"];
  string type = 3 [json_name = "type"];
  string status = 4 [json_name = "status"];
  int32 replicas = 5 [json_name = "replicas"];
  int32 ready_replicas = 6 [json_name = "readyReplicas"];
  string last_abnormal = 7 [json_name = "lastAbnormal"];
}

message AppDTOApplicationComponentStatusResponse {
  string app_id = 1 [json_name = "appId"];
  repeated AppDTOApplicationComponentStatus components = 2 [json_name = "components"];
}

message AppDTOApplicationLifecycleRequest {
  AppDTOWorkflowCallback callback = 1 [json_name = "callback"];
}

message AppDTOApplicationResources {
  string cpu_req = 1 [json_name = "cpuReq"];
  string mem_req = 2 [json_name = "memReq"];
  string cpu_limit = 3 [json_name = "cpuLimit"];
  string mem_limit = 4 [json_name = "memLimit"];
  int32 replicas = 5 [json_name = "replicas"];
}

message AppDTOApplicationStatusResponse {
  string app_id = 1 [json_name = "appId"];
  string status = 2 [json_name = "status"];
}

message AppDTOApplicationTask {
  string task_id = 1 [json_name = "taskId"];
  string app_id = 2 [json_name = "appId"];
  string workflow_id = 3 [json_name = "workflowId"];
  string workflow_name = 4 [json_name = "workflowName"];
  string workflow_display_name = 5 [json_name = "workflowDisplayName"];
  string status = 6 [json_name = "status"];
  string type = 7 [json_name = "type"];
  string task_creator = 8 [json_name = "taskCreator"];
  string task_revoker = 9 [json_name = "taskRevoker"];
  google.protobuf.Timestamp create_time = 10 [json_name = "createTime"];
  google.protobuf.Timestamp update_time = 11 [json_name = "updateTime"];
  repeated AppDTOAllowedAction allowed_actions = 12 [json_name = "allowedActions"];
}

message AppDTOApplicationWithComponents {
  string workspace_id = 1 [json_name = "workspaceID"];
  string id = 2 [json_name = "id"];
  string name = 3 [json_name = "name"];
  string namespace = 4 [json_name = "namespace"];
  string alias = 5 [json_name = "alias"];
  string project = 6 [json_name = "project"];
  string version = 7 [json_name = "version"];
  string description = 8 [json_name = "description"];
  google.protobuf.Timestamp create_time = 9 [json_name = "createTime"];
  google.protobuf.Timestamp update_time = 10 [json_name = "updateTime"];
  string icon = 11 [json_name = "icon"];
  string workflow_id = 12 [json_name = "workflowId"];
  bool template_enabled = 13 [json_name = "templateEnabled"];
  string management_mode = 14 [json_name = "managementMode"];
  AppDTOApplicationResources resources = 15 [json_name = "resources"];
  repeated AppDTOBatchApplicationComponent components = 16 [json_name = "components"];
}

message AppDTOApplicationWorkflow {
  string id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  string alias = 3 [json_name = "alias"];
  string namespace = 4 [json_name = "namespace"];
  string project_id = 5 [json_name = "projectId"];
  string description = 6 [json_name = "description"];
  string status = 7 [json_name = "status"];
  bool disabled = 8 [json_name = "disabled"];
  string failure_policy = 9 [json_name = "failurePolicy"];
  repeated AppDTOWorkflowStepDetail steps = 10 [json_name = "steps"];
  AppDTOWorkflowCallback callback = 11 [json_name = "callback"];
  google.protobuf.Timestamp create_time = 12 [json_name = "createTime"];
  google.protobuf.Timestamp update_time = 13 [json_name = "updateTime"];
  string workflow_type = 14 [json_name = "workflowType"];
  AppDTOUpdateApplicationWorkflowRequest spec = 15 [json_name = "spec"];
}

message AppDTOBatchApplicationComponent {
  int32 id = 1 [json_name = "id"];
  string app_id = 2 [json_name = "appId"];
  string name = 3 [json_name = "name"];
  string namespace = 4 [json_name = "namespace"];
  int32 replicas = 5 [json_name = "replicas"];
  string component_type = 6 [json_name = "type"];
  AppDTOBatchApplicationComponentProperties properties = 7 [json_name = "properties"];
}

message AppDTOBatchApplicationComponentProperties {
  repeated AppSpecPorts ports = 1 [json_name = "ports"];
}

message AppDTOBatchApplicationComponentStatusRequest {
  repeated string app_i_ds = 1 [json_name = "appIds"];
}

message AppDTOBatchApplicationComponentStatusResponse {
  repeated AppDTOBatchApplicationComponentStatusResult results = 1 [json_name = "results"];
}

message AppDTOBatchApplicationComponentStatusResult {
  string app_id = 1 [json_name = "appId"];
  string status = 2 [json_name = "status"];
  string error = 3 [json_name = "error"];
}

message AppDTOBatchGetApplicationsRequest {
  repeated string app_i_ds = 1 [json_name = "appIds"];
}

message AppDTOBatchGetApplicationsResponse {
  repeated AppDTOApplicationWithComponents applications = 1 [json_name = "applications"];
}

message AppDTOCancelAllApplicationWorkflowsResponse {
  string app_id = 1 [json_name = "appId"];
  repeated string cancelled_task_i_ds = 2 [json_name = "cancelledTaskIds"];
}

message AppDTOCancelWorkflowRequest {
  string task_id = 1 [json_name = "taskId"];
  string user = 2 [json_name = "user"];
  string reason = 3 [json_name = "reason"];
}

message AppDTOCancelWorkflowResponse {
  string task_id = 1 [json_name = "taskId"];
  string status = 2 [json_name = "status"];
}

message AppDTOCleanupApplicationResourcesPlanResponse {
  string app_id = 1 [json_name = "appId"];
  string plan_fingerprint = 2 [json_name = "planFingerprint"];
  repeated AppDTOImportNamespaceResourceResult resource_results = 3 [json_name = "resourceResults"];
  repeated string warnings = 4 [json_name = "warnings"];
}

message AppDTOCleanupApplicationResourcesRequest {
  string plan_fingerprint = 1 [json_name = "planFingerprint"];
}

message AppDTOCleanupApplicationResourcesResponse {
  string app_id = 1 [json_name = "appId"];
  string task_id = 2 [json_name = "taskId"];
  repeated string deleted_resources = 3 [json_name = "deletedResources"];
  repeated string failed_resources = 4 [json_name = "failedResources"];
  repeated string retained_resources = 5 [json_name = "retainedResources"];
}

message AppDTOComponentContainerInfo {
  string name = 1 [json_name = "name"];
  string image = 2 [json_name = "image"];
  bool ready = 3 [json_name = "ready"];
  int32 restart_count = 4 [json_name = "restartCount"];
  string state = 5 [json_name = "state"];
  string reason = 6 [json_name = "reason"];
}

message AppDTOComponentContainersResponse {
  string app_id = 1 [json_name = "appId"];
  string component_name = 2 [json_name = "componentName"];
  string component_type = 3 [json_name = "componentType"];
  repeated AppDTOComponentPodContainers pods = 4 [json_name = "pods"];
}

message AppDTOComponentCredentialInfo {
  string source = 1 [json_name = "source"];
  string env_name = 2 [json_name = "envName"];
  string secret_name = 3 [json_name = "secretName"];
  string key = 4 [json_name = "key"];
  string value = 5 [json_name = "value"];
  bool resolved = 6 [json_name = "resolved"];
}

message AppDTOComponentIngressInfo {
  string name = 1 [json_name = "name"];
  string namespace = 2 [json_name = "namespace"];
  string ingress_class_name = 3 [json_name = "ingressClassName"];
  map<string, string> annotations = 4 [json_name = "annotations"];
  repeated AppSpecIngressTLSConfig tls = 5 [json_name = "tls"];
  repeated AppDTOComponentIngressRouteInfo routes = 6 [json_name = "routes"];
}

message AppDTOComponentIngressRouteInfo {
  string host = 1 [json_name = "host"];
  string path = 2 [json_name = "path"];
  string path_type = 3 [json_name = "pathType"];
  string service_name = 4 [json_name = "serviceName"];
  int32 service_port = 5 [json_name = "servicePort"];
  int32 weight = 6 [json_name = "weight"];
  map<string, string> headers = 7 [json_name = "headers"];
  AppSpecRewritePolicy rewrite = 8 [json_name = "rewrite"];
}

message AppDTOComponentPodContainers {
  string pod_name = 1 [json_name = "podName"];
  string namespace = 2 [json_name = "namespace"];
  string phase = 3 [json_name = "phase"];
  repeated AppDTOComponentContainerInfo containers = 4 [json_name = "containers"];
}

message AppDTOComponentResourceConfig {
  string scope = 1 [json_name = "scope"];
  string name = 2 [json_name = "name"];
  string cpu = 3 [json_name = "cpu"];
  string memory = 4 [json_name = "memory"];
  string cpu_limit = 5 [json_name = "cpuLimit"];
  string memory_limit = 6 [json_name = "memoryLimit"];
  string gpu = 7 [json_name = "gpu"];
}

message AppDTOComponentServiceInfo {
  string name = 1 [json_name = "name"];
  string namespace = 2 [json_name = "namespace"];
  string type = 3 [json_name = "type"];
  bool headless = 4 [json_name = "headless"];
  string external_name = 5 [json_name = "externalName"];
  repeated AppDTOComponentServicePortInfo ports = 6 [json_name = "ports"];
}

message AppDTOComponentServicePortInfo {
  string name = 1 [json_name = "name"];
  int32 port = 2 [json_name = "port"];
  int32 target_port = 3 [json_name = "targetPort"];
  string protocol = 4 [json_name = "protocol"];
}

message AppDTOComponentTaskStatus {
  string name = 1 [json_name = "name"];
  string type = 2 [json_name = "type"];
  string status = 3 [json_name = "status"];
  string error = 4 [json_name = "error"];
  int64 start_time = 5 [json_name = "startTime"];
  int64 end_time = 6 [json_name = "endTime"];
}

message AppDTOComponentUpdateSpec {
  string action = 1 [json_name = "action"];
  string name = 2 [json_name = "name"];
  string image = 3 [json_name = "image"];
  optional int32 replicas = 4 [json_name = "replicas"];
  map<string, string> env = 5 [json_name = "env"];
  string component_type = 6 [json_name = "type"];
  AppSpecProperties properties = 7 [json_name = "properties"];
  AppSpecTraits traits = 8 [json_name = "traits"];
}

message AppDTOConvertApplicationsRequest {
  string yaml = 1 [json_name = "yaml"];
  string file_url = 2 [json_name = "fileUrl"];
  optional bool validate = 3 [json_name = "validate"];
}

message AppDTOConvertApplicationsResponse {
  repeated AppDTOCreateComponentRequest components = 1 [json_name = "components"];
  bool valid = 2 [json_name = "valid"];
