  string workflow_id = 14 [json_name = "workflowId"];
  int64 execute_at = 15 [json_name = "executeAt"];
}

message AppDTOCreateApplicationsRequest {
  string id = 1 [json_name = "id"];
  string name = 2 [json_name = "name"];
  string namespace = 3 [json_name = "namespace"];
  string alias = 4 [json_name = "alias"];
  string version = 5 [json_name = "version"];
  string project = 6 [json_name = "project"];
  string description = 7 [json_name = "description"];
  string icon = 8 [json_name = "icon"];
  repeated AppDTOCreateComponentRequest components = 9 [json_name = "components"];
  repeated AppDTOCreateWorkflowStepRequest workflow = 10 [json_name = "workflow"];
  AppDTOWorkflowCallback callback = 11 [json_name = "callback"];
  string failure_policy = 12 [json_name = "failurePolicy"];
  optional bool template_enabled = 13 [json_name = "templateEnabled"];
}

message AppDTOCreateComponentRequest {
  string name = 1 [json_name = "name"];
  string component_type = 2 [json_name = "type"];
  string image = 3 [json_name = "image"];
  string namespace = 4 [json_name = "namespace"];
  int32 replicas = 5 [json_name = "replicas"];
  AppSpecProperties properties = 6 [json_name = "properties"];
  AppSpecTraits traits = 7 [json_name = "traits"];
