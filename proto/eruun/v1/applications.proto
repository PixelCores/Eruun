message AppDTOCreateWorkflowStepRequest {
  string scheduling_class = 1 [json_name = "schedulingClass"];
  string name = 2 [json_name = "name"];
  string step_type = 3 [json_name = "stepType"];
  string workflow_type = 4 [json_name = "jobType"];
  AppDTOWorkflowStepApproval approval = 5 [json_name = "approval"];
  repeated AppDTOWorkflowProperties properties = 6 [json_name = "properties"];
  repeated string components = 7 [json_name = "components"];
  string mode = 8 [json_name = "mode"];
  repeated AppDTOCreateWorkflowSubStepRequest sub_steps = 9 [json_name = "subSteps"];
}

message AppDTOCreateWorkflowSubStepRequest {
  string scheduling_class = 1 [json_name = "schedulingClass"];
  string name = 2 [json_name = "name"];
  string workflow_type = 3 [json_name = "jobType"];
  repeated AppDTOWorkflowProperties properties = 4 [json_name = "properties"];
  repeated string components = 5 [json_name = "components"];
}

message AppDTODatabaseResetRequest {
  repeated string components = 1 [json_name = "components"];
  optional string init_sqlurl = 2 [json_name = "initSqlUrl"];
}

message AppDTODatabaseResetResponse {
  string app_id = 1 [json_name = "appId"];
  string workflow_id = 2 [json_name = "workflowId"];
  string task_id = 3 [json_name = "taskId"];
  repeated string database_components = 4 [json_name = "databaseComponents"];
  repeated string restart_components = 5 [json_name = "restartComponents"];
}

message AppDTODeleteApplicationRequest {
  optional int64 wait_seconds = 1 [json_name = "waitSeconds"];
}

message AppDTODeleteApplicationResponse {
  string app_id = 1 [json_name = "appId"];
  repeated string cancelled_task_i_ds = 2 [json_name = "cancelledTaskIds"];
  repeated string active_task_i_ds = 3 [json_name = "activeTaskIds"];
  repeated string deleted_resources = 4 [json_name = "deletedResources"];
  repeated string failed_resources = 5 [json_name = "failedResources"];
