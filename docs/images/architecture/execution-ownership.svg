<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="970" viewBox="0 0 1280 970" role="img" aria-labelledby="title desc">
<title id="title">一次执行，如何避免旧 Worker 覆盖新状态</title>
<desc id="desc">Scheduler 条件认领 waiting task 并获得 generation 和 token，将 dispatch 交给队列。Worker 收到消息后向 MySQL 认领，成功后绑定 workerId 并续租。租约过期由 Scheduler 回收；旧代次后续续租或状态写入被拒绝，新派发生成新身份。</desc>
<defs>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2864d7"/></marker>
<marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#0b817b"/></marker>
<marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5b7087"/></marker>
<marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7954af"/></marker>
<marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#a56b18"/></marker>
</defs>
<style>text{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:"SFMono-Regular",Consolas,monospace}</style>
<rect x="0" y="0" width="1280" height="970" rx="0" fill="#ffffff" stroke="none"/>
<text x="40" y="40" font-size="14" font-weight="600" fill="#5b7087" text-anchor="start" letter-spacing="2">ERUUN / ARCHITECTURE     03</text>
<text x="40" y="84" font-size="30" font-weight="700" fill="#18324f" text-anchor="start">一次执行，如何避免旧 Worker 覆盖新状态</text>
<text x="40" y="117" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">租约判断执行是否仍有效；generation / token 区分不同代次。</text>
<rect x="55" y="153" width="210" height="57" rx="12" fill="#f4f7fc" stroke="#cdd8e5"/>
<text x="160" y="189" font-size="22" font-weight="600" fill="#7954af" text-anchor="middle">Scheduler</text>
<path d="M 160 210 L 160 814" fill="none" stroke="#cdd8e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<rect x="345" y="153" width="210" height="57" rx="12" fill="#f4f7fc" stroke="#cdd8e5"/>
<text x="450" y="189" font-size="22" font-weight="600" fill="#7954af" text-anchor="middle">消息队列</text>
<path d="M 450 210 L 450 814" fill="none" stroke="#cdd8e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<rect x="645" y="153" width="210" height="57" rx="12" fill="#f4f7fc" stroke="#cdd8e5"/>
<text x="750" y="189" font-size="22" font-weight="600" fill="#2864d7" text-anchor="middle">Worker</text>
<path d="M 750 210 L 750 814" fill="none" stroke="#cdd8e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<rect x="1015" y="153" width="210" height="57" rx="12" fill="#f4f7fc" stroke="#cdd8e5"/>
<text x="1120" y="189" font-size="22" font-weight="600" fill="#0b817b" text-anchor="middle">MySQL</text>
<path d="M 1120 210 L 1120 814" fill="none" stroke="#cdd8e5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<path d="M 160 257 L 1120 257" fill="none" stroke="#7954af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#purple)"/>
<text x="640.0" y="245" font-size="19" font-weight="400" fill="#7954af" text-anchor="middle">① 条件认领 waiting → queued，生成 generation / token</text>
<path d="M 1120 310 L 160 310" fill="none" stroke="#0b817b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#teal)"/>
<text x="640.0" y="298" font-size="19" font-weight="400" fill="#0b817b" text-anchor="middle">返回当前执行身份</text>
<path d="M 160 368 L 450 368" fill="none" stroke="#7954af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#purple)"/>
<text x="305.0" y="356" font-size="19" font-weight="400" fill="#7954af" text-anchor="middle">② 发布 dispatch</text>
<path d="M 450 421 L 750 421" fill="none" stroke="#7954af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#purple)"/>
<text x="600.0" y="409" font-size="19" font-weight="400" fill="#7954af" text-anchor="middle">③ 可重复交付通知</text>
<path d="M 750 479 L 1120 479" fill="none" stroke="#2864d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="935.0" y="467" font-size="19" font-weight="400" fill="#2864d7" text-anchor="middle">④ 校验代次 / Token，claim</text>
<path d="M 1120 532 L 750 532" fill="none" stroke="#0b817b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#teal)"/>
<text x="935.0" y="520" font-size="19" font-weight="400" fill="#0b817b" text-anchor="middle">running，绑定 workerId 与租约</text>
<path d="M 750 585 L 1120 585" fill="none" stroke="#2864d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="935.0" y="573" font-size="19" font-weight="400" fill="#2864d7" text-anchor="middle">⑤ 续租 / 按 ownership 写进度</text>
<rect x="40" y="626" width="1200" height="246" rx="12" fill="#fff9ee" stroke="#ead8b4"/>
<path d="M 160 670 L 160 836" fill="none" stroke="#ddcfb4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<path d="M 450 670 L 450 836" fill="none" stroke="#ddcfb4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<path d="M 750 670 L 750 836" fill="none" stroke="#ddcfb4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<path d="M 1120 670 L 1120 836" fill="none" stroke="#ddcfb4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/>
<text x="62" y="657" font-size="19" font-weight="600" fill="#a56b18" text-anchor="start">故障分支 · Worker 停止续租</text>
<path d="M 160 709 L 1120 709" fill="none" stroke="#a56b18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<text x="640.0" y="697" font-size="19" font-weight="400" fill="#a56b18" text-anchor="middle">Scheduler 按数据库时间确认过期：清除旧 ownership → waiting</text>
<path d="M 750 764 L 1120 764" fill="none" stroke="#a56b18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/>
<text x="935.0" y="752" font-size="19" font-weight="400" fill="#a56b18" text-anchor="middle">旧身份尝试续租 / 写入</text>
<path d="M 1120 819 L 750 819" fill="none" stroke="#a56b18" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#amber)"/>
<text x="935.0" y="807" font-size="19" font-weight="400" fill="#a56b18" text-anchor="middle">ownership 不匹配，拒绝</text>
<text x="62" y="851" font-size="18" font-weight="400" fill="#a56b18" text-anchor="start">下一次派发重新生成 generation / token；接手执行仍需通过正常 claim。</text>
<path d="M 40 923 L 1240 923" fill="none" stroke="#cdd8e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="950" font-size="16" font-weight="400" fill="#5b7087" text-anchor="start">fencing 保护准入与数据库写入；已经发生的 Kubernetes / 外部副作用仍需幂等或补偿。</text>
</svg>
