<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1070" viewBox="0 0 1280 1070" role="img" aria-labelledby="title desc">
<title id="title">从应用声明到实际运行</title>
<desc id="desc">API 校验并保存声明。执行请求创建 waiting task，由 Scheduler 派发、Worker 认领。Worker 先构建 JobTask 资源计划，再确保空间安全基线并调和 Kubernetes 资源。API 查询分别读取运行时写入的任务进度和 Controller 投影的组件状态。</desc>
<defs>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2864d7"/></marker>
<marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#0b817b"/></marker>
<marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5b7087"/></marker>
<marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7954af"/></marker>
<marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#a56b18"/></marker>
</defs>
<style>text{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:"SFMono-Regular",Consolas,monospace}</style>
<rect x="0" y="0" width="1280" height="1070" rx="0" fill="#ffffff" stroke="none"/>
<text x="40" y="40" font-size="14" font-weight="600" fill="#5b7087" text-anchor="start" letter-spacing="2">ERUUN / ARCHITECTURE     02</text>
<text x="40" y="84" font-size="30" font-weight="700" fill="#18324f" text-anchor="start">从应用声明到实际运行</text>
<text x="40" y="117" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">保存、执行和观察是三段独立生命周期；每段都有明确的状态负责人。</text>
<rect x="40" y="155" width="340" height="670" rx="12" fill="#f3f6fc" stroke="none"/>
<text x="64" y="187" font-size="22" font-weight="600" fill="#2864d7" text-anchor="start">API</text>
<text x="64" y="215" font-size="17" font-weight="400" fill="#5b7087" text-anchor="start">声明与任务入口</text>
<rect x="410" y="155" width="400" height="670" rx="12" fill="#f7f4fc" stroke="none"/>
<text x="434" y="187" font-size="22" font-weight="600" fill="#7954af" text-anchor="start">Scheduler / Worker</text>
<text x="434" y="215" font-size="17" font-weight="400" fill="#5b7087" text-anchor="start">调度、计划与执行</text>
<rect x="840" y="155" width="400" height="670" rx="12" fill="#f0f8f6" stroke="none"/>
<text x="864" y="187" font-size="22" font-weight="600" fill="#0b817b" text-anchor="start">Kubernetes / Controller</text>
<text x="864" y="215" font-size="17" font-weight="400" fill="#5b7087" text-anchor="start">资源运行与状态观察</text>
<rect x="62" y="252" width="296" height="112" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="62" y="252" width="5" height="112" rx="2" fill="#2864d7" stroke="none"/>
<text x="87" y="286" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">校验并保存声明</text>
<text x="87" y="316" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">Application / Component</text>
<text x="87" y="343" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">Workflow · 事务写入 MySQL</text>
<text x="210" y="393" font-size="18" font-weight="600" fill="#2864d7" text-anchor="middle">仅保存：到此返回</text>
<path d="M 210 404 L 210 448" fill="none" stroke="#2864d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" marker-end="url(#blue)"/>
<text x="224" y="430" font-size="17" font-weight="400" fill="#2864d7" text-anchor="start">请求执行</text>
<rect x="62" y="448" width="296" height="112" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="62" y="448" width="5" height="112" rx="2" fill="#2864d7" stroke="none"/>
<text x="87" y="482" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">创建执行实例</text>
<text x="87" y="512" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">持久化 waiting task</text>
<text x="87" y="539" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">返回 TaskID，供后续查询</text>
<path d="M 358 504 L 432 504" fill="none" stroke="#2864d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="432" y="448" width="356" height="112" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="432" y="448" width="5" height="112" rx="2" fill="#7954af" stroke="none"/>
<text x="457" y="482" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">派发与认领</text>
<text x="457" y="512" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">Scheduler 生成执行身份</text>
<text x="457" y="539" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">Worker 取得租约后开始运行</text>
<path d="M 610 560 L 610 590" fill="none" stroke="#7954af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#purple)"/>
<rect x="432" y="590" width="356" height="98" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="432" y="590" width="5" height="98" rx="2" fill="#7954af" stroke="none"/>
<text x="457" y="624" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">构建完整资源计划</text>
<text x="457" y="654" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">Workflow → JobTask</text>
<text x="457" y="681" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">组件规格 + Trait → 资源对象</text>
<path d="M 610 688 L 610 718" fill="none" stroke="#2864d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="432" y="718" width="356" height="88" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="432" y="718" width="5" height="88" rx="2" fill="#2864d7" stroke="none"/>
<text x="457" y="752" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">执行部署动作</text>
<text x="457" y="782" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">空间基线 → 调和 / 等待 → 进度</text>
<path d="M 788 762 L 862 762" fill="none" stroke="#2864d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="862" y="718" width="356" height="88" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="862" y="718" width="5" height="88" rx="2" fill="#0b817b" stroke="none"/>
<text x="887" y="752" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">Kubernetes 运行资源</text>
<text x="887" y="782" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">服务持续运行；Job 按自身周期完成</text>
<path d="M 1040 718 L 1040 688" fill="none" stroke="#0b817b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#teal)"/>
<rect x="862" y="590" width="356" height="98" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="862" y="590" width="5" height="98" rx="2" fill="#0b817b" stroke="none"/>
<text x="887" y="624" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">Controller 观察并投影</text>
<text x="887" y="654" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">条件更新运行状态与就绪副本</text>
<text x="887" y="681" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">保留用户声明和停止 / 清理意图</text>
<rect x="432" y="252" width="356" height="112" rx="12" fill="#fff" stroke="#ded4eb"/>
<text x="457" y="286" font-size="22" font-weight="600" fill="#7954af" text-anchor="start">步骤如何执行</text>
<text x="457" y="316" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">外层步骤顺序推进</text>
<text x="457" y="343" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">步骤内串行，或按优先级分组并行</text>
<rect x="862" y="252" width="356" height="112" rx="12" fill="#fff" stroke="#bfd8d1"/>
<text x="887" y="286" font-size="22" font-weight="600" fill="#0b817b" text-anchor="start">资源有独立生命周期</text>
<text x="887" y="316" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">资源可以在任务结束后继续运行</text>
<text x="887" y="343" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">Workflow 完成不代表资源已就绪</text>
<path d="M 610 806 L 610 850 L 334 850 L 334 880" fill="none" stroke="#2864d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M 1218 639 L 1230 639 L 1230 850 L 946 850 L 946 880" fill="none" stroke="#0b817b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#teal)"/>
<rect x="40" y="880" width="588" height="112" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="40" y="880" width="5" height="112" rx="2" fill="#2864d7" stroke="none"/>
<text x="65" y="914" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">API 查询 · 任务进度</text>
<text x="65" y="944" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">这次操作执行到了哪一步？</text>
<text x="65" y="971" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">数据来自 Workflow / Job 运行时写入的进度。</text>
<rect x="650" y="880" width="590" height="112" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="650" y="880" width="5" height="112" rx="2" fill="#0b817b" stroke="none"/>
<text x="675" y="914" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">API 查询 · 组件状态</text>
<text x="675" y="944" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">资源现在是否就绪或异常？</text>
<text x="675" y="971" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">数据来自 Controller 的条件状态投影。</text>
<path d="M 40 1023 L 1240 1023" fill="none" stroke="#cdd8e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="1050" font-size="16" font-weight="400" fill="#5b7087" text-anchor="start">保存应用不会创建 Kubernetes 资源。Workflow 完成、workload 就绪、异步 Job 完成须分别判断。</text>
</svg>
