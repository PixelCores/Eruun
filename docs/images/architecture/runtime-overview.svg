<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
<title id="title">角色协作与数据流</title>
<desc id="desc">调用方通过 API 保存声明和提交任务。Scheduler 通过 MySQL 认领任务并发送 dispatch，Worker 认领后操作 Kubernetes。Controller 观察 Pod 并将状态投影到数据库。四角色共享持久化数据；Redis 与结果存储提供支撑能力。</desc>
<defs>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#2864d7"/></marker>
<marker id="teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#0b817b"/></marker>
<marker id="muted" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#5b7087"/></marker>
<marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7954af"/></marker>
<marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#a56b18"/></marker>
</defs>
<style>text{font-family:Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:"SFMono-Regular",Consolas,monospace}</style>
<rect x="0" y="0" width="1280" height="960" rx="0" fill="#ffffff" stroke="none"/>
<text x="40" y="40" font-size="14" font-weight="600" fill="#5b7087" text-anchor="start" letter-spacing="2">ERUUN / ARCHITECTURE     01</text>
<text x="40" y="84" font-size="30" font-weight="700" fill="#18324f" text-anchor="start">角色协作与数据流</text>
<text x="40" y="117" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">同一个二进制，四种运行角色；数据库协调执行，Kubernetes 承载工作负载。</text>
<rect x="40" y="215" width="830" height="522" rx="12" fill="#f6f8fc" stroke="#cdd8e5"/>
<text x="66" y="246" font-size="16" font-weight="600" fill="#5b7087" text-anchor="start" letter-spacing="1">ERUUN 控制面</text>
<rect x="922" y="215" width="318" height="522" rx="12" fill="#f0f9f7" stroke="#c3ddd6"/>
<text x="948" y="246" font-size="16" font-weight="600" fill="#0b817b" text-anchor="start">KUBERNETES 执行环境</text>
<rect x="66" y="149" width="320" height="51" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="66" y="149" width="5" height="51" rx="2" fill="#2864d7" stroke="none"/>
<text x="91" y="183" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">调用方 · HTTP / gRPC</text>
<path d="M 226 200 L 226 274" fill="none" stroke="#2864d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<rect x="66" y="274" width="320" height="118" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="66" y="274" width="5" height="118" rx="2" fill="#2864d7" stroke="none"/>
<text x="91" y="308" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">API</text>
<text x="91" y="338" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">校验、授权与声明保存</text>
<text x="91" y="365" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">提交任务，提供状态查询</text>
<rect x="500" y="274" width="336" height="118" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="500" y="274" width="5" height="118" rx="2" fill="#7954af" stroke="none"/>
<text x="525" y="308" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">Scheduler</text>
<text x="525" y="338" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">认领待执行任务并派发</text>
<text x="525" y="365" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">回收过期租约 · 独立选主</text>
<rect x="500" y="508" width="336" height="118" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="500" y="508" width="5" height="118" rx="2" fill="#2864d7" stroke="none"/>
<text x="525" y="542" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">Worker</text>
<text x="525" y="572" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">认领执行、续租、推进步骤</text>
<text x="525" y="599" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">生成计划并调和实际资源</text>
<rect x="66" y="508" width="320" height="118" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="66" y="508" width="5" height="118" rx="2" fill="#0b817b" stroke="none"/>
<text x="91" y="542" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">Controller</text>
<text x="91" y="572" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">观察 Pod、更新组件状态</text>
<text x="91" y="599" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">延迟任务与结果交付 · 独立选主</text>
<rect x="66" y="429" width="470" height="48" rx="12" fill="#eaf0fb" stroke="#b7cae7"/>
<text x="301" y="459" font-size="20" font-weight="600" fill="#18324f" text-anchor="middle">MySQL · 声明 / 任务 / 执行身份</text>
<path d="M 226 392 L 226 429" fill="none" stroke="#2864d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<path d="M 500 333 L 450 333 L 450 429" fill="none" stroke="#7954af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#purple)" marker-start="url(#purple)"/>
<path d="M 500 567 L 450 567 L 450 477" fill="none" stroke="#2864d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)" marker-start="url(#blue)"/>
<path d="M 226 508 L 226 477" fill="none" stroke="#0b817b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/>
<rect x="577" y="417" width="228" height="76" rx="12" fill="#f3effa" stroke="#d6c7e7"/>
<text x="691" y="448" font-size="20" font-weight="600" fill="#7954af" text-anchor="middle">dispatch 通知</text>
<text x="691" y="477" font-size="16" font-weight="400" fill="#5b7087" text-anchor="middle">Redis Streams / Kafka</text>
<path d="M 691 392 L 691 417" fill="none" stroke="#7954af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#purple)"/>
<path d="M 691 493 L 691 508" fill="none" stroke="#7954af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#purple)"/>
<rect x="948" y="290" width="266" height="116" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="948" y="290" width="5" height="116" rx="2" fill="#0b817b" stroke="none"/>
<text x="973" y="324" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">业务工作负载</text>
<text x="973" y="354" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">Deployment / StatefulSet</text>
<text x="973" y="381" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">Job / CronJob 等</text>
<rect x="948" y="438" width="266" height="116" rx="12" fill="#fff" stroke="#cdd8e5"/>
<rect x="948" y="438" width="5" height="116" rx="2" fill="#0b817b" stroke="none"/>
<text x="973" y="472" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">评测执行单元</text>
<text x="973" y="502" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">Runner Job：编排与采集</text>
<text x="973" y="529" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">Sandbox：执行与评分</text>
<path d="M 836 583 L 922 583" fill="none" stroke="#2864d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="879" y="565" font-size="17" font-weight="400" fill="#2864d7" text-anchor="middle">调和</text>
<path d="M 1081 600 L 1081 702 L 226 702 L 226 626" fill="none" stroke="#0b817b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#teal)"/>
<text x="629" y="692" font-size="18" font-weight="400" fill="#0b817b" text-anchor="middle">Pod 观察 → 条件更新组件状态</text>
<path d="M 956 164 L 996 164" fill="none" stroke="#2864d7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#blue)"/>
<text x="1007" y="170" font-size="16" font-weight="400" fill="#5b7087" text-anchor="start">命令 / 持久化</text>
<path d="M 956 192 L 996 192" fill="none" stroke="#0b817b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#teal)"/>
<text x="1007" y="198" font-size="16" font-weight="400" fill="#5b7087" text-anchor="start">运行状态反馈</text>
<rect x="40" y="770" width="588" height="112" rx="12" fill="#fffaf1" stroke="#cdd8e5"/>
<rect x="40" y="770" width="5" height="112" rx="2" fill="#a56b18" stroke="none"/>
<text x="65" y="804" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">Redis</text>
<text x="65" y="834" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">会话、缓存、锁与取消信号</text>
<text x="65" y="861" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">选择 Kafka 后，Redis 仍是必要依赖。</text>
<rect x="650" y="770" width="590" height="112" rx="12" fill="#fffaf1" stroke="#cdd8e5"/>
<rect x="650" y="770" width="5" height="112" rx="2" fill="#a56b18" stroke="none"/>
<text x="675" y="804" font-size="22" font-weight="600" fill="#18324f" text-anchor="start">结果存储</text>
<text x="675" y="834" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">MySQL 制品记录与源归档；MinIO / 数据库副本</text>
<text x="675" y="861" font-size="18" font-weight="400" fill="#5b7087" text-anchor="start">执行状态与各目标保存状态分别管理。</text>
<path d="M 40 913 L 1240 913" fill="none" stroke="#cdd8e5" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="940" font-size="16" font-weight="400" fill="#5b7087" text-anchor="start">图示主业务链路；省略健康检查、辅助访问和内部调用。API / Worker 可多副本，两个 Leader 任期相互独立。</text>
</svg>
